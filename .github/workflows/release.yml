name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手动跑只构建、不发布，用来验证 workflow

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建 universal app
        run: ./build.sh --universal

      - name: 打包
        run: |
          ditto -c -k --keepParent "build/OCR Snip.app" "OCR-Snip.zip"
          echo "SHA256: $(shasum -a 256 OCR-Snip.zip | cut -d' ' -f1)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OCR-Snip
          path: OCR-Snip.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OCR-Snip.zip \
            --title "OCR Snip $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
